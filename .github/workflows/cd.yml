name: CD Pipeline (Production Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Pre-deployment CI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend Build
        run: |
          cd backend
          npm ci
          npm run build

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Validate Rust Backend Build
        run: |
          cd backend-rust
          cargo check --release

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: pre-deploy-validation
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          envs: APP_DIR
          script: |
            set -e

            # Target project directory on EC2 (defaults to ~/braj_Hotel or ~/brijnidhi if APP_DIR secret not set)
            TARGET_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/brijnidhi" ]; then
                TARGET_DIR="$HOME/brijnidhi"
              elif [ -d "$HOME/braj_Hotel" ]; then
                TARGET_DIR="$HOME/braj_Hotel"
              elif [ -d "/var/www/brijnidhi" ]; then
                TARGET_DIR="/var/www/brijnidhi"
              else
                echo "❌ Error: Application directory not found. Please set the APP_DIR secret (e.g. /home/ubuntu/brijnidhi)."
                exit 1
              fi
            fi

            echo "🚀 Starting Deployment in: $TARGET_DIR"
            cd "$TARGET_DIR"

            # Verify Git repository
            if [ ! -d ".git" ]; then
              echo "❌ Error: $TARGET_DIR is not a git repository."
              exit 1
            fi

            # Check production .env file safety
            if [ ! -f "backend/.env" ]; then
              echo "⚠️ Warning: backend/.env was not found in $TARGET_DIR/backend/.env."
              echo "Please ensure production DB and secret variables are placed there."
            else
              echo "🔒 Verified: backend/.env exists and is preserved."
            fi

            # Fetch and checkout latest main
            echo "📥 Pulling latest changes from origin/main..."
            git fetch origin main
            git checkout main
            git pull origin main

            # Make deployment scripts executable
            chmod +x scripts/*.sh 2>/dev/null || true

            # Deploy Services: Node API, Next Frontend, and Rust Admin Backend
            # Modes supported: 'docker' (Option 1 - default) or 'native' (Option 2)
            RUST_MODE="${{ secrets.RUST_DEPLOY_MODE }}"
            if [ -z "$RUST_MODE" ]; then
              RUST_MODE="docker"
            fi

            if [ -f "scripts/deploy.sh" ]; then
              echo "🚀 Executing unified deploy script in mode: $RUST_MODE..."
              ./scripts/deploy.sh "$RUST_MODE"
            else
              echo "📦 Building Backend..."
              cd backend
              npm ci --prefer-offline --no-audit
              npm run build
              cd ..

              echo "📦 Building Frontend..."
              cd frontend
              npm ci --prefer-offline --no-audit
              npm run build
              cd ..

              pm2 startOrReload ecosystem.config.js --env production
              pm2 save
            fi

            # Health Check Verification
            echo "🩺 Verifying application health across all services..."
            sleep 5

            # 1. Backend Node API Health Check (Port 5000)
            BACKEND_HEALTH_URL="http://127.0.0.1:5000/api/health"
            echo "Checking Backend (Node API): $BACKEND_HEALTH_URL"
            if curl -s -f -m 10 "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "✅ Backend API is healthy!"
            else
              echo "❌ Backend health check failed on $BACKEND_HEALTH_URL"
              pm2 logs brijnidhi-backend --lines 20 --nostream
              exit 1
            fi

            # 2. Rust Admin API Health Check (Port 5001)
            RUST_HEALTH_URL="http://127.0.0.1:5001/health"
            echo "Checking Rust Admin API: $RUST_HEALTH_URL"
            if curl -s -f -m 10 "$RUST_HEALTH_URL" > /dev/null; then
              echo "✅ Rust Admin API is healthy!"
            else
              echo "❌ Rust Admin health check failed on $RUST_HEALTH_URL"
              docker logs brijnidhi-admin-rust-container --tail 25 2>/dev/null || pm2 logs brijnidhi-rust-admin --lines 25 --nostream
              exit 1
            fi

            # 3. Frontend Health Check (Port 3000)
            FRONTEND_URL="http://127.0.0.1:3000"
            echo "Checking Frontend: $FRONTEND_URL"
            if curl -s -f -m 10 "$FRONTEND_URL" > /dev/null; then
              echo "✅ Frontend is healthy!"
            else
              echo "❌ Frontend health check failed on $FRONTEND_URL"
              pm2 logs brijnidhi-frontend --lines 20 --nostream
              exit 1
            fi

            echo "🎉 Deployment successfully completed!"
