# ==============================================================================
# Nginx Virtual Host Configuration for Brijnidhi
# Location: /etc/nginx/sites-available/brijnidhi.conf
#
# Port Mapping:
# - Frontend (Next.js):     http://127.0.0.1:3000
# - Backend API (Node.js):   http://127.0.0.1:5000
# - Rust Admin Backend:     http://127.0.0.1:5001
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace with your actual domain name or EC2 Public IP / DNS
    # Example: server_name brijnidhi.com www.brijnidhi.com;
    server_name _;

    # Maximum file upload size (hotel photos, documents, etc.)
    client_max_body_size 50M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # 1. Rust Admin API (Direct route for ultra-fast Rust backend performance)
    # --------------------------------------------------------------------------
    location /rust-admin/ {
        rewrite ^/rust-admin/(.*) /api/admin/$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Main Backend API (Node.js + Express API on port 5000)
    #    Also automatically proxies /api/admin/* to Rust on port 5001
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 3. Next.js Static Cache Optimization
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Frontend Application (Next.js SSR on port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
